[package]
name = "holodeck"
version = "0.1.0"
description = "Holodeck desktop app"
edition = "2021"
publish = false

[lib]
name = "holodeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
