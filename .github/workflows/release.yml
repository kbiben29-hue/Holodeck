# Every push to main (and manual runs) publishes:
#  • the play site → GitHub Pages of this repo: https://kbiben29-hue.github.io/Holodeck/
#    (Settings → Pages → Source: GitHub Actions)
#  • Mac (.dmg, universal) and Windows (.exe) apps → a new release on this repo, always at
#      https://github.com/kbiben29-hue/Holodeck/releases/latest/download/Holodeck-Mac.dmg
#      https://github.com/kbiben29-hue/Holodeck/releases/latest/download/Holodeck-Windows-Setup.exe
# No card data is published: the site and apps fetch it from Scryfall on each
# player's own device. Only GITHUB_TOKEN is used; no extra secrets.

name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  site:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund && npm run build
      - name: Check no card data was bundled
        run: if [ -e dist/cards ]; then echo "dist/cards must not be published"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install --no-audit --no-fund
      - run: npx --yes @tauri-apps/cli@^2 build ${{ matrix.args }}
      - name: Check no card data was bundled
        shell: bash
        run: if [ -e dist/cards ]; then echo "dist/cards must not be in an app build"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: holodeck-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir out
          cp "$(find installers -name '*.dmg' | head -1)" out/Holodeck-Mac.dmg
          cp "$(find installers -name '*.exe' | head -1)" out/Holodeck-Windows-Setup.exe
          tag="build-${{ github.run_number }}"
          gh release create "$tag" out/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Holodeck (build ${{ github.run_number }})" \
            --notes "Mac: Holodeck-Mac.dmg (Apple silicon and Intel). Windows: Holodeck-Windows-Setup.exe. Play in a browser instead: https://kbiben29-hue.github.io/Holodeck/ — The apps load the cards from Scryfall on first launch (internet needed). They are not code-signed: on a Mac, right-click the app and choose Open (or System Settings → Privacy & Security → Open Anyway); on Windows, click More info → Run anyway." \
            --latest
          # keep only the 3 newest builds
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --repo "${{ github.repository }}" --yes --cleanup-tag; done
